# A/B control for the MinIO capacity baseline: the SAME 200MB of random bytes,
# on the same node, behind the same k6 and the same CPU limit - but served by
# nginx with sendfile, which hands pages from the page cache straight to the
# socket without copying them through userspace.
#
# If this moves far more bytes per core than MinIO, the cost is MinIO's
# read-into-userspace-then-write path, and it is avoidable. If it lands about
# the same, the cost is the pod network path itself and no server choice fixes
# it. Load-test fixture only - not part of the tanukistore deployment.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-sendfile
  namespace: tanukistore
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events { worker_connections 4096; }
    http {
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        root /data;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-sendfile
  namespace: tanukistore
  labels: { app: nginx-sendfile }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx-sendfile }
  template:
    metadata:
      labels: { app: nginx-sendfile }
    spec:
      initContainers:
        - name: fixture
          image: busybox:1.37
          command: ["sh", "-c", "head -c 209715200 /dev/urandom > /data/asset-200mb.bin && ls -l /data"]
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - { name: http, containerPort: 8080 }
          # Identical to MinIO's, so the comparison is on efficiency rather than
          # on who was allowed more cores.
          resources:
            requests: { cpu: "500m", memory: 256Mi }
            limits: { cpu: "8", memory: 8Gi }
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 1Gi }
        - name: conf
          configMap: { name: nginx-sendfile }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-sendfile
  namespace: tanukistore
spec:
  selector: { app: nginx-sendfile }
  ports:
    - { name: http, port: 8080, targetPort: http }
