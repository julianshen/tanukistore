# Runs loadtest/tanukistore.js in-cluster against the tanukistore Service.
#   kubectl -n tanukistore create configmap k6-tanukistore \
#     --from-file=loadtest/tanukistore.js --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n tanukistore delete job k6-tanukistore --ignore-not-found
#   kubectl -n tanukistore apply -f deploy/tanukistore/k6-job.yaml
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-tanukistore
  namespace: tanukistore
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: k6-tanukistore }
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.58.0
          args: ["run", "/scripts/tanukistore.js"]
          env:
            - { name: MODE, value: "stepped" }
            - { name: RATE, value: "1000" }
            - { name: DURATION, value: "40s" }
            # Go sizes its scheduler from the NODE's 16 cores, not from this
            # container's quota, so without this k6 bursts past its limit and
            # CFS freezes it for whole 100ms periods - which k6 then reports as
            # server latency. The first stepped run showed exactly that: a
            # 0.46ms median beside a 273ms p95 while the server sat at 0.86 of
            # its 1 core, unthrottled. Keep this equal to limits.cpu.
            - { name: GOMAXPROCS, value: "12" }
          resources:
            requests: { cpu: "4", memory: 1Gi }
            # 12 cores against a server capped at 1. For tiny requests the
            # generator does more work per request than the server does, so it
            # needs far more headroom than the thing it is measuring.
            limits: { cpu: "12", memory: 6Gi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap: { name: k6-tanukistore }
